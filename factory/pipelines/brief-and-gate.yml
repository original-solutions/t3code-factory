# The simplest useful pipeline: one agent with a brief, one gate, two tries.
id: brief-and-gate
name: Brief and gate
nodes:
  - id: start
    kind: start
    x: 40
    y: 200
  - id: build
    kind: agent
    label: Build
    x: 280
    y: 200
    instructions:
      brief: |
        Read the issue named in this message. Implement what it asks for in this worktree with
        a failing test first. Run the project's own checks. Commit, push the branch and open a
        draft pull request with gh. End with FACTORY-DONE: <pull request URL>.
  - id: gate
    kind: verify
    label: Gate
    x: 520
    y: 200
    check:
      commands:
        - factory/scripts/check.sh
  - id: done
    kind: end
    result: done
    x: 760
    y: 200
  - id: stuck
    kind: end
    result: stuck
    x: 520
    y: 420
edges:
  - id: e1
    from: start
    port: next
    to: build
  - id: e2
    from: build
    port: done
    to: gate
  - id: e3
    from: gate
    port: fail
    to: build
    max: 2
    instructions:
      brief: The gate failed. Fix what its output below shows, push, and end with a result line.
  - id: e4
    from: gate
    port: pass
    to: done
  - id: e5
    from: build
    port: stop
    to: stuck
  - id: e6
    from: build
    port: questions
    to: stuck
